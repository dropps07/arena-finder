spring:
    application:
        name: api-gateway

    cloud:
        gateway:
            routes:
                - id: auth-service
                  uri: ${AUTH_SERVICE_URL:http://localhost:8081}
                  predicates:
                      - Path=/auth/**

                - id: arena-service
                  uri: ${ARENA_SERVICE_URL:http://localhost:8082}
                  predicates:
                      - Path=/arenas/**

                - id: booking-service
                  uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
                  predicates:
                      - Path=/bookings/**

                - id: ai-service
                  uri: ${AI_SERVICE_URL:http://localhost:8085}
                  predicates:
                      - Path=/ai/**

server:
    port: ${SERVER_PORT:8080}

jwt:
    secret: ${JWT_SECRET:local-dev-secret-must-be-at-least-32-characters-long}

management:
    endpoints:
        web:
            exposure:
                include: health,info

logging:
    level:
        com.arenafinder: DEBUG
        org.springframework.cloud.gateway: DEBUG
