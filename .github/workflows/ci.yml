# ═══════════════════════════════════════════════════════════════
#  CI PIPELINE — runs on every push and pull request to main
#
#  WHAT THIS DOES:
#  ───────────────
#  1. Checks out code
#  2. Sets up Java 21
#  3. Caches Maven dependencies
#  4. Builds the entire project
#  5. Runs all unit tests
#  6. Builds Docker images (verifies Dockerfiles are valid)
# ═══════════════════════════════════════════════════════════════

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build all services
        run: mvn clean install -DskipTests

      - name: Run tests
        run: mvn test

      # Docker smoke test
      # Uses repo root as build context
      # and service-specific Dockerfiles
      - name: Build Docker images (smoke test)
        run: |
          for service in auth-service arena-service booking-service notification-service ai-service api-gateway; do
            echo "Building $service..."
            docker build \
              -f $service/Dockerfile \
              -t arena-finder/$service:ci \
              .
          done

  # ─────────────────────────────────────────────────
  #  CODE QUALITY CHECK
  # ─────────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Check code formatting (SpotBugs)
        run: mvn spotbugs:check || true
